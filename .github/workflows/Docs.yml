name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "*.toml"
    tags: ["*"]
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "*.toml"
    types: [opened, synchronize, reopened]
env:
  JULIA_NUM_THREADS: auto

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install go-sendxmpp
        run: sudo apt install go-sendxmpp
      - name: Create data/ dir
        run: mkdir -p scripts/data
      - name: Start prosody server
        run: docker compose -f scripts/docker-compose.yml up -d
      - name: create user pinocchio
        run: docker compose -f scripts/docker-compose.yml exec prosody prosodyctl register pinocchio localhost plopiplop
      - name: create user gepetto
        run: docker compose -f scripts/docker-compose.yml exec prosody prosodyctl register gepetto localhost plopiplop
      - name: Install mod_roster_command
        run: docker compose -f scripts/docker-compose.yml exec prosody prosodyctl install --server=https://modules.prosody.im/rocks/ mod_roster_command
      - name: Subscribe users
        run: docker compose -f scripts/docker-compose.yml exec prosody prosodyctl mod_roster_command subscribe_both gepetto@localhost pinocchio@localhost
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - name: Use Julia cache
        uses: julia-actions/cache@v3
      - name: Instantiate environment with development version of the package
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Run doctest
        run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using Strophe
            DocMeta.setdocmeta!(Strophe, :DocTestSetup, :(using Strophe); recursive=true)
            doctest(Strophe)'
      - name: Generate and deploy documentation
        run: julia --project=docs -t auto docs/make.jl
        env:
          JULIA_PKG_SERVER: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GKSwstype: "100" # https://discourse.julialang.org/t/generation-of-documentation-fails-qt-qpa-xcb-could-not-connect-to-display/60988
      - name: Stop containers
        if: always()
        run: docker compose -f scripts/docker-compose.yml down
